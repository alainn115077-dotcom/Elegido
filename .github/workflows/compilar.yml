name: Compilar ELEGIDO MANAGER

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web:
    name: App web (la que usa Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: dotnet build ElegidoManager/ElegidoManager.csproj -c Release
      - name: Probar imagen Docker (igual que Vercel)
        run: docker build -t elegido-manager .
      - name: Arrancar con MongoDB de prueba
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7
          sleep 5
          docker run -d --name app --network host -e PORT=8080 \
            -e ConnectionStrings__MongoDB="mongodb://127.0.0.1:27017" -e MongoDB__BaseDatos=prueba elegido-manager
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/Cuenta/Login && break; sleep 2; done
          docker logs app | tail -20
      - name: Recorrer la app (crear admin, entrar y abrir cada sección)
        run: bash .github/prueba.sh http://127.0.0.1:8080
      - name: Bitácora del servidor si algo falló
        if: failure()
        run: docker logs app | tail -120

  escritorio:
    name: App de escritorio (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Crear ElegidoManager.exe
        run: dotnet publish ElegidoManager.Escritorio/ElegidoManager.Escritorio.csproj -c Release -o AppEscritorio
      - uses: actions/upload-artifact@v4
        with:
          name: ElegidoManager-Escritorio
          path: AppEscritorio/ElegidoManager.exe
